<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Games</title><style>html,body{height:100%;margin:0;background:#050811;color:#e5e7eb;font-family:system-ui,sans-serif}body{display:grid;place-items:center}p{opacity:.75}button,a{font:inherit}</style></head><body><p>Spiel wird geladen …</p><script>(async()=>{const sleep=ms=>new Promise(r=>setTimeout(r,ms));const fetchText=async p=>{let last;for(let i=0;i<3;i++){try{const r=await fetch(p,i?{cache:'no-store'}:undefined);if(!r.ok)throw new Error(`${p}: HTTP ${r.status}`);return await r.text()}catch(err){last=err;if(i<2)await sleep(250*(i+1))}}throw last};try{if(typeof DecompressionStream!=='function')throw new Error('Dieser Browser ist zu alt für das Spiel. Bitte Browser aktualisieren.');const parts=await Promise.all(['data/bot-labyrinth-1.txt','data/bot-labyrinth-2.txt','data/bot-labyrinth-3.txt','data/bot-labyrinth-4.txt','data/bot-labyrinth-5.txt','data/bot-labyrinth-6.txt'].map(fetchText));const b64=parts.join('').replace(/\s+/g,'');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const source=await new Response(stream).text();const mobileCss='<link rel="stylesheet" href="data/bot-mobile-pass.css">';const gameplay='<script src="data/bot-gameplay-core.js"><\/script><script src="data/bot-gameplay-feedback.js"><\/script><script src="data/bot-gameplay-rhythm.js"><\/script><script src="data/bot-gameplay-levels.js"><\/script><script src="data/bot-gameplay-boss.js"><\/script>';const messageAddon='<script src="data/bot-message-addon.js"><\/script>';const progressAddon='<script src="data/bot-progress.js"><\/script>';let finalSource=source.includes('</head>')?source.replace('</head>',mobileCss+'</head>'):mobileCss+source;const addons=gameplay+messageAddon+progressAddon;finalSource=finalSource.includes('</body>')?finalSource.replace('</body>',addons+'</body>'):finalSource+addons;document.open();document.write(finalSource);document.close()}catch(err){document.body.innerHTML='<main style="max-width:650px;padding:32px;text-align:center"><h1>Spiel konnte nicht geladen werden</h1><p>'+String(err)+'</p><p><button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:10px;background:#22d3ee;color:#05202a;font-weight:700;cursor:pointer">Nochmals laden</button></p><p><a href="./" style="color:#22d3ee">Zurück zu IB Games</a></p></main>'}})();</script></body></html>
