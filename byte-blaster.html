<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IB Games</title><style>html,body{height:100%;margin:0;background:#050811;color:#e5e7eb;font-family:system-ui,sans-serif}body{display:grid;place-items:center}p{opacity:.75}button,a{font:inherit}</style></head><body><p>Spiel wird geladen …</p><script>(async()=>{const sleep=ms=>new Promise(r=>setTimeout(r,ms));const fetchText=async p=>{let last;for(let i=0;i<3;i++){try{const r=await fetch(p,i?{cache:'no-store'}:undefined);if(!r.ok)throw new Error(`${p}: HTTP ${r.status}`);return await r.text()}catch(err){last=err;if(i<2)await sleep(250*(i+1))}}throw last};try{if(typeof DecompressionStream!=='function')throw new Error('Dieser Browser ist zu alt für das Spiel. Bitte Browser aktualisieren.');const files=['data/byte-blaster-1.txt','data/byte-blaster-2.txt','data/byte-blaster-3.txt','data/byte-blaster-4.txt','data/byte-blaster-5a.txt','data/byte-blaster-5b.txt','data/byte-blaster-5c.txt','data/byte-blaster-5d.txt','data/byte-blaster-6a.txt','data/byte-blaster-6b.txt','data/byte-blaster-6c.txt','data/byte-blaster-6d.txt'];const parts=await Promise.all(files.map(fetchText));const unzip=async b64=>{const bytes=Uint8Array.from(atob(b64.replace(/\s+/g,'')),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return new Response(stream).text()};const source=await unzip(parts.join(''));const patched=source.replace('user-scalable=no">','user-scalable=no, viewport-fit=cover">').replace('</head>','<link rel="stylesheet" href="data/byte-blaster-mobile2.css"><link rel="stylesheet" href="data/byte-blaster-polish-base.css"><link rel="stylesheet" href="data/byte-blaster-polish-header.css"><link rel="stylesheet" href="data/byte-blaster-polish-panels.css"><link rel="stylesheet" href="data/byte-blaster-polish-speedrun.css"><link rel="stylesheet" href="data/byte-blaster-polish-switches.css"><link rel="stylesheet" href="data/byte-blaster-polish-modes.css"><link rel="stylesheet" href="data/byte-blaster-polish-responsive.css"><link rel="stylesheet" href="data/byte-blaster-polish-hardening.css"><link rel="stylesheet" href="data/byte-blaster-mobile3.css"><link rel="stylesheet" href="data/byte-blaster-drop-v2.css"></head>').replace('</body>','<script src="data/byte-blaster-drop-v2.js"></'+'script><script src="data/byte-blaster-global-polish.js"></'+'script></body>');document.open();document.write(patched);document.close()}catch(err){document.body.innerHTML='<main style="max-width:650px;padding:32px;text-align:center"><h1>Spiel konnte nicht geladen werden</h1><p>'+String(err)+'</p><p><button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:10px;background:#22d3ee;color:#05202a;font-weight:700;cursor:pointer">Nochmals laden</button></p><p><a href="./" style="color:#22d3ee">Zurück zu IB Games</a></p></main>'}})();</script></body></html>
