<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Games</title><style>html,body{height:100%;margin:0;background:#050811;color:#e5e7eb;font-family:system-ui,sans-serif}body{display:grid;place-items:center}p{opacity:.75}</style></head><body><p>Spiel wird geladen …</p><script>(async()=>{try{const parts=await Promise.all(['data/byte-blaster-1.txt','data/byte-blaster-2.txt','data/byte-blaster-3.txt','data/byte-blaster-4.txt','data/byte-blaster-5a.txt','data/byte-blaster-5b.txt','data/byte-blaster-5c.txt','data/byte-blaster-5d.txt','data/byte-blaster-6a.txt','data/byte-blaster-6b.txt','data/byte-blaster-6c.txt','data/byte-blaster-6d.txt'].map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const source=await new Response(stream).text();document.open();document.write(source);document.close()}catch(err){document.body.innerHTML='<main style="max-width:650px;padding:32px"><h1>Spiel konnte nicht geladen werden</h1><p>'+String(err)+'</p><p><a href="./" style="color:#22d3ee">Zurück zu IB Games</a></p></main>'}})();</script></body></html>
